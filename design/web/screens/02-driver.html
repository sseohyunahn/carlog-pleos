<!doctype html>
<html lang="ko" data-theme="night" data-frame="half">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CarLog 운전자 선택</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>
  [data-frame="full"] .rail-hide { display: none; }
  /* app column stays empty under the scrim: the handover is only shown after a driver is chosen */
  .frame__body { margin-top: 24px; }

  /* driver dialog */
  .driver-dialog { padding: 56px 48px 40px; }
  .driver-dialog .dialog__body { margin-top: 16px; }
  .driver-dialog .people { margin-top: 48px; }
  .person { cursor: pointer; justify-content: flex-start; min-height: 300px; padding: 40px 24px 32px; }
  .person__note { min-height: 28px; display: inline-flex; align-items: center; gap: 8px; }
  .person { box-shadow: inset 0 0 0 2px var(--divider); }
  /* last driver: marked, not preselected (no Sand fill; the answer is still open) */
  .person.is-last { background: var(--raised); color: var(--text); box-shadow: inset 0 0 0 3px var(--text-2); }
  .person.is-last .avatar { background: var(--primary); color: var(--on-primary); box-shadow: none; }
  .person.is-last .person__note,
  [data-theme="day"] .person.is-last .person__note { color: var(--text-2); }
  .person.is-pressed { transform: scale(.95); }
  .dialog__foot { display: flex; align-items: center; gap: var(--sp-l); margin-top: 40px; padding-top: 32px; border-top: 2px solid var(--divider); }
  .dialog__foot .hint { flex: 1; display: flex; gap: 14px; align-items: flex-start; }
  .dialog__foot .hint .i { margin-top: -4px; }

  [data-frame="half"] .driver-dialog { width: calc(100% - 2 * var(--gutter-half)); }
  [data-frame="full"] .driver-dialog { width: 1180px; padding: 64px 64px 48px; }
  [data-frame="full"] .driver-dialog .people { gap: 32px; }
  [data-frame="full"] .person { min-height: 340px; padding-top: 52px; gap: 24px; }
  [data-frame="full"] .person .avatar { width: 136px; height: 136px; font: 800 56px/1 var(--font); }
  [data-frame="full"] .person__name { font: var(--title-l); }
</style>
</head>
<body>
<script src="../icons.js"></script>
<div class="frame">
  <div class="shell" aria-hidden="true">
    <nav class="rail" aria-label="화면">
      <div class="wordmark">CarLog</div>
      <div class="rail__item is-on"><svg class="i"><use href="#i-board"/></svg>인계 보드</div>
      <div class="rail__item"><svg class="i"><use href="#i-pen"/></svg>인계 남기기</div>
      <div class="rail__item"><svg class="i"><use href="#i-clock"/></svg>지난 기록</div>
      <div class="rail__item"><svg class="i"><use href="#i-gear"/></svg>설정</div>
    </nav>
    <div style="flex:1;display:flex;flex-direction:column;min-width:0">
      <header class="appbar">
        <span class="wordmark rail-hide">CarLog</span>
        <span class="appbar__spacer"></span>
        <span class="link"><span class="link__dot"></span>차량 연결됨</span>
        <span class="driver"><span class="avatar">아</span>아버지<svg class="i i--s"><use href="#i-chevron"/></svg></span>
      </header>
      <nav class="tabs" aria-label="화면">
        <div class="tab is-on">인계 보드</div><div class="tab">인계 남기기</div><div class="tab">지난 기록</div><div class="tab">설정</div>
      </nav>

      <main class="frame__body" aria-hidden="true"></main>
    </div>
  </div>

  <!-- 운전자 선택: 앱 시작 때, 20분 넘게 자리를 비운 뒤.
       선택 전에는 이전 운전자의 인계를 보여주지 않아요(DrivingOverlay와 같은 규칙) → 본문은 비워 둠.
       '마지막 운전자' 타일은 표시만 하고 미리 선택하지 않아요(Sand 채움 없음).
       앱 문자열 제안: TextButton '그대로 아버지' → '아버지로 계속하기' (바깥 탭으로 닫히지 않는 시작 다이얼로그의 명시적 닫기). -->
  <div class="scrim"></div>
  <section class="dialog driver-dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
    <h2 class="dialog__title" id="dlg-title">이번 운전자는 누구인가요?</h2>
    <p class="dialog__body">운전자를 고르면 이전 운전자가 남긴 인계를 먼저 보여드려요.</p>
    <div class="people" role="group" aria-label="프로필">
      <div class="person is-last" role="button">
        <span class="avatar">아</span>
        <span class="person__name">아버지</span>
        <span class="person__note">마지막 운전자</span>
      </div>
      <div class="person" role="button">
        <span class="avatar">어</span>
        <span class="person__name">어머니</span>
        <span class="person__note"></span>
      </div>
      <div class="person" role="button">
        <span class="avatar">자</span>
        <span class="person__name">자녀</span>
        <span class="person__note"></span>
      </div>
    </div>
    <div class="dialog__foot">
      <p class="hint"><svg class="i i--s"><use href="#i-user"/></svg><span>프로필은 작성자 구분용이며 본인 인증이 아니에요.</span></p>
      <button class="btn btn--ghost">아버지로 계속하기</button>
    </div>
  </section>
</div>
</body>
</html>
