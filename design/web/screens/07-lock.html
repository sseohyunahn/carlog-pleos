<!doctype html>
<html lang="ko" data-theme="night" data-frame="half">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CarLog 주행 중 잠금</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>
  [data-frame="full"] .rail-hide { display: none; }

  /* app chrome stays visible but cannot be used while CarUxRestrictions are active */
  .rail__item, .rail__item.is-on { color: var(--disabled); font-weight: 500; box-shadow: none; }
  .rail__item.is-on { background: var(--surface); }
  .driver { padding-right: 28px; background: transparent; box-shadow: inset 0 0 0 2px var(--divider); color: var(--text-2); }
  .driver .avatar { background: var(--raised); color: var(--text-2); }

  /* the lock covers tabs + content of the app column */
  .lock-host { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 24px; margin-bottom: 32px;
    border-radius: var(--r-sheet); overflow: hidden; }
  [data-frame="full"] .lock-host { margin-bottom: 40px; }

  /* static, theme-independent overlay */
  .lock { gap: 0; padding: 64px 56px; border-radius: var(--r-sheet);
    --lk-line: color-mix(in srgb, var(--static-text) 14%, var(--static-bg));
    --lk-panel: color-mix(in srgb, var(--static-text) 6%, var(--static-bg)); }
  .lock__badge { width: 112px; height: 112px; border-radius: 50%; display: grid; place-items: center; color: var(--static-text-2);
    box-shadow: inset 0 0 0 3px var(--lk-line); flex: none; }
  .lock__title { margin-top: 40px; }
  .lock__sub { margin-top: 16px; }

  .reading { margin-top: 64px; width: 100%; max-width: 760px; background: var(--lk-panel); border-radius: 36px; padding: 40px 40px 40px;
    display: flex; flex-direction: column; align-items: center; gap: 0; box-shadow: inset 0 0 0 2px var(--lk-line); }
  .reading__status { display: flex; align-items: center; gap: 16px; font: var(--label-m); color: var(--static-text-2); }
  .eq { display: flex; align-items: center; gap: 6px; height: 32px; }
  .eq i { width: 6px; border-radius: 3px; background: var(--static-text); }
  .eq i.off { background: var(--static-text-2); }
  .reading__what { font: var(--title-m); color: var(--static-text); margin-top: 16px; }
  .reading .btn { margin-top: 36px; }

  [data-frame="full"] .lock { flex-direction: row; justify-content: center; align-items: center; text-align: left; gap: 0; padding: 64px 96px; }
  [data-frame="full"] .lock__intro { flex: 1; max-width: 760px; display: flex; flex-direction: column; align-items: flex-start; padding-right: 88px; }
  [data-frame="full"] .reading { margin-top: 0; flex: none; width: 640px; align-items: stretch; padding: 48px; }
  [data-frame="full"] .reading__what { font: var(--title-l); margin-top: 20px; }
  [data-frame="full"] .reading .btn { margin-top: 48px; }
  .lock__intro { display: contents; }
  [data-frame="full"] .lock__intro { display: flex; }
</style>
</head>
<body>
<script src="../icons.js"></script>
<div class="frame">
  <div class="shell">
    <nav class="rail" aria-label="화면" aria-disabled="true">
      <div class="wordmark">CarLog</div>
      <div class="rail__item is-on"><svg class="i"><use href="#i-board"/></svg>인계 보드</div>
      <div class="rail__item"><svg class="i"><use href="#i-pen"/></svg>인계 남기기</div>
      <div class="rail__item"><svg class="i"><use href="#i-clock"/></svg>지난 기록</div>
      <div class="rail__item"><svg class="i"><use href="#i-gear"/></svg>설정</div>
    </nav>
    <div style="flex:1;display:flex;flex-direction:column;min-width:0">
      <header class="appbar">
        <span class="wordmark rail-hide">CarLog</span>
        <span class="appbar__spacer"></span>
        <span class="link"><span class="link__dot"></span>차량 연결됨</span>
        <span class="driver" aria-disabled="true"><span class="avatar">어</span>어머니</span>
      </header>

      <div class="lock-host">
        <nav class="tabs" aria-hidden="true">
          <div class="tab is-on">인계 보드</div><div class="tab">인계 남기기</div><div class="tab">지난 기록</div><div class="tab">설정</div>
        </nav>
        <main class="frame__body" aria-hidden="true"></main>

        <!-- CarUxRestrictions 활성: 입력·확인은 막고, 읽어주기(눈을 쓰지 않는 동작)만 남겨요 -->
        <section class="lock" role="alertdialog" aria-labelledby="lock-title" aria-describedby="lock-sub">
          <div class="lock__intro">
            <span class="lock__badge"><svg class="i i--l"><use href="#i-lock"/></svg></span>
            <h2 class="lock__title" id="lock-title">주행 중에는 잠시 쉬어갈게요</h2>
            <p class="lock__sub" id="lock-sub">인계 확인과 입력은 안전하게 정차한 뒤 이용해 주세요.</p>
          </div>
          <div class="reading" aria-live="polite">
            <div class="reading__status">
              <span class="eq" aria-hidden="true"><i style="height:14px"></i><i style="height:26px"></i><i style="height:32px"></i><i style="height:20px"></i><i class="off" style="height:12px"></i></span>
              아버지의 인계를 읽고 있어요
            </div>
            <!-- 제안(앱 변경): 요약 한 줄은 현재 DrivingOverlay에 없는 추가 내용이에요. 30자 이내, 한눈에 읽히는 위치와 메모 수만.
                 TTS가 멈춘 상태에서는 상태줄 없이 '인계 읽어주기'(재생 아이콘) 버튼을 보여줘요. -->
            <div class="reading__what">B3층 C17구역, 확인할 메모 2건</div>
            <button class="btn btn--l btn--primary btn--block"><svg class="i"><use href="#i-stop"/></svg>읽기 중지</button>
          </div>
        </section>
      </div>
    </div>
  </div>
</div>
</body>
</html>
