name: 개선 제안
description: 해결하고 싶은 불편과 개선 방법을 제안해주세요.
title: "[개선] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 상황의 불편인가요?
      description: 누가 언제 겪는 문제인지 설명해주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 동작
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료를 확인하는 방법
      description: 개선 전후가 어떻게 달라지는지 확인할 수 있는 사례를 적어주세요.
