name: 버그 제보
description: 앱이 예상과 다르게 동작한 상황을 알려주세요.
title: "[버그] "
body:
  - type: input
    id: environment
    attributes:
      label: 실행 환경
      placeholder: "예: Pleos Connect 2.1.0 / Android 14 / 앱 0.1.0"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 사용 모드
      options:
        - 시연 모드
        - Pleos 연결
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 순서
      description: 어떤 프로필에서 어떤 화면과 버튼을 사용했는지 적어주세요.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 예상한 결과와 실제 결과
    validations:
      required: true
